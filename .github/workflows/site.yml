# Site: builds the app and deploys it to Cloudflare on every push to main
# (thesciclub.com) and tests (tests.thesciclub.com), and the admin site beside
# it (the admin job, below). Netlify did this until
# 2026-11-20; its credits ran out on deploys (the owner).
#
# Each site's build settings are variables of a GitHub environment, site-live
# or site-tests: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY,
# VITE_VAPID_PUBLIC_KEY, VITE_PASSKEYS, VITE_APPLE_SIGN_IN, and on site-tests
# TEST_SUPABASE_REF. All are public (they end up in the browser bundle).
# CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID are
# repository secrets. cloudflare/wrangler.toml has the rest.
#
# Only in the owner's repository: pushes reach Able-Bodied/thesciclub too,
# which has no Cloudflare token.

name: Site

on:
  push:
    branches: [main, tests]
  workflow_dispatch:

# A newer push to the same branch replaces an older one's deploy.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # write: a live deploy tags its commit as a release (below).
  contents: write

jobs:
  deploy:
    if: >-
      github.repository == 'Alfredx48/TheSciClub' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/tests')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref == 'refs/heads/main' && 'site-live' || 'site-tests' }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # All history and tags: the step below compares with the last release.
          fetch-depth: 0

      # Only the admin site changed since the app's last release (the owner,
      # 2026-11-22: admin-site changes go straight to main): the app is not
      # rebuilt, so installed apps do not download a copy and reload for it.
      # Compared with the last release tag, not the previous push, so an app
      # release whose run a quick admin push cancelled still goes out.
      - name: What changed
        id: scope
        run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0 --match 'release-*' HEAD 2>/dev/null || true)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && [ -n "$last" ] && \
             ! git diff --name-only "$last" HEAD \
               | grep -qvE '^(admin/|cloudflare/admin/|vite\.admin\.config\.ts$|supabase/templates/magic_link\.html$)'; then
            echo "Only the admin site changed since $last: the app is not redeployed."
            echo "app=no" >> "$GITHUB_OUTPUT"
          else
            echo "app=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.app == 'yes'

      - uses: actions/setup-node@v5
        if: steps.scope.outputs.app == 'yes'
        with:
          node-version: 24
          # The runner's cached 24.x lags security releases.
          check-latest: true
          cache: pnpm

      - name: Install
        if: steps.scope.outputs.app == 'yes'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.scope.outputs.app == 'yes'
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_PASSKEYS: ${{ vars.VITE_PASSKEYS }}
          VITE_APPLE_SIGN_IN: ${{ vars.VITE_APPLE_SIGN_IN }}
          TEST_SUPABASE_REF: ${{ vars.TEST_SUPABASE_REF }}
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            [ -n "${!name}" ] || { echo "::error::Set the $name variable of this environment"; exit 1; }
          done
          # The test site must not be built against the live project, nor the reverse.
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            [ -z "$TEST_SUPABASE_REF" ] || { echo "::error::site-live has TEST_SUPABASE_REF"; exit 1; }
          else
            [[ "$VITE_SUPABASE_URL" == "https://$TEST_SUPABASE_REF.supabase.co" ]] \
              || { echo "::error::site-tests must name its test project in both variables"; exit 1; }
          fi
          pnpm build
          node scripts/cloudflare-site.mjs

      - name: Deploy
        if: steps.scope.outputs.app == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          site=()
          [ "$GITHUB_REF" = refs/heads/main ] || site=(--env tests)
          pnpm dlx --allow-build=esbuild --allow-build=workerd wrangler@4.149.0 deploy \
            --config cloudflare/wrangler.toml "${site[@]}" \
            --var "VITE_SUPABASE_URL:$VITE_SUPABASE_URL" \
            --var "VITE_SUPABASE_ANON_KEY:$VITE_SUPABASE_ANON_KEY"

      # Each live release is tagged release-<its build minute>, the minute the
      # app and /version.json carry and every page-speed sample says (the
      # owner, 2026-11-21), so a slower release can be found and rebuilt.
      - name: Tag the release
        if: steps.scope.outputs.app == 'yes' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          built=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("dist/version.json","utf8")).built)')
          tag="release-${built//:/}"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null \
            || echo "::warning::Could not tag $tag"
          echo "Tagged $tag at $GITHUB_SHA"

  # The admin site (admin/, the owner, 2026-11-22): built and deployed apart from the app, to its
  # own Worker, so that a broken app build or deploy does not keep administrators from it.
  # admin.thesciclub.com is a route on that Worker. Live only: the owner, 2026-11-22, "we don't
  # need a test site for the admin site", so its changes go straight to main.
  admin:
    # After the app's job, whatever became of it, so its release tag is there for the list of
    # releases; a failed app deploy still deploys the admin site.
    needs: deploy
    if: >-
      always() &&
      github.repository == 'Alfredx48/TheSciClub' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref == 'refs/heads/main' && 'site-live' || 'site-tests' }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          check-latest: true
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_REF: ${{ vars.TEST_SUPABASE_REF }}
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            [ -n "${!name}" ] || { echo "::error::Set the $name variable of this environment"; exit 1; }
          done
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            [ -z "$TEST_SUPABASE_REF" ] || { echo "::error::site-live has TEST_SUPABASE_REF"; exit 1; }
            export VITE_APP_ORIGIN=https://thesciclub.com
          else
            [[ "$VITE_SUPABASE_URL" == "https://$TEST_SUPABASE_REF.supabase.co" ]] \
              || { echo "::error::site-tests must name its test project in both variables"; exit 1; }
            export VITE_APP_ORIGIN=https://tests.thesciclub.com
          fi
          pnpm vite build --config vite.admin.config.ts
          # The release the app's job just tagged, then the list of releases.
          git fetch --quiet --tags origin
          node admin/releases.mjs dist-admin/releases.json

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          site=()
          [ "$GITHUB_REF" = refs/heads/main ] || site=(--env tests)
          pnpm dlx --allow-build=esbuild --allow-build=workerd wrangler@4.149.0 deploy \
            --config cloudflare/admin/wrangler.toml "${site[@]}"
