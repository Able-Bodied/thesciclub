<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#102A4C" />
    <!-- Install names stay the same even when the current page has its own title. -->
    <meta name="application-name" content="The Sci Club" />
    <meta name="apple-mobile-web-app-title" content="The Sci Club" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- favicon.ico first, for browsers and bookmark tools that still look for
         it by convention. The PNGs are what modern browsers actually pick. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <!-- Large icons also cover browsers that create a shortcut without reading the manifest. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Member pages are never public (CONTEXT.md). Keep the whole app out of indexes. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>The Sci Club</title>
    <!-- The club's address is thesciclub.com (2026-10-03). Anybody on the old
         Netlify address, in a browser or in a Home Screen app installed from
         it, is moved to the same page there. In the page and not a Netlify
         redirect: an installed app's service worker answers from its own copy
         and never sees a server redirect, and redirecting /sw.js across
         domains would stop that copy from ever updating. The static /privacy
         and /terms still answer here for checkers that run no script, which
         the text-message registration's links rely on. Deploy previews have
         other host names and are left alone. -->
    <script>
      if (location.hostname === 'thesciclub.netlify.app') {
        location.replace(
          'https://thesciclub.com' + location.pathname + location.search + location.hash,
        );
      }
    </script>
    <!-- Light or dark before the first paint, from the setting on Me → Display
         (src/lib/accessibility.tsx keeps it in step after that). Without this a
         member who chose Dark sees a white flash on every launch. -->
    <script>
      try {
        const appearance = JSON.parse(
          localStorage.getItem('thesciclub.accessibility') || '{}',
        ).appearance;
        if (appearance === 'light' || appearance === 'dark') {
          document.documentElement.dataset.appearance = appearance;
        }
        // /join is always light: see useForceLight in src/lib/accessibility.tsx.
        const joining = location.pathname === '/join';
        if (joining) document.documentElement.dataset.forceLight = '';
        const dark =
          !joining &&
          (appearance === 'dark' ||
            (appearance !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches));
        if (dark) document.querySelector('meta[name="theme-color"]').content = '#141619';
      } catch {
        // Storage blocked: the phone's own setting applies, through the CSS.
      }
    </script>
    <!-- Both faces are served from this site, never Google Fonts: a private
         club should not tell a third party each time a member opens it.
         Preloaded so the first screen is drawn in them rather than swapped
         into them. -->
    <link
      rel="preload"
      href="/fonts/AtkinsonHyperlegibleNext-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/Outfit-Bold.ttf" as="font" type="font/ttf" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
