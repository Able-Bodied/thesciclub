# Netlify serves the club at https://thesciclub.com (www redirects to it). The
# old thesciclub.netlify.app address still answers, and the page itself sends
# people on to thesciclub.com (index.html says why it is not a redirect here). Builds `main`. Until 2026-10-03 the domain served the design mock
# from docs/ on GitHub Pages; that mock is gone (CONTEXT.md, "Working model").

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Corepack so the pinned pnpm in package.json is the one that runs.
  NPM_FLAGS = "--version"

# A single-page app: every path is served by index.html and routed in the
# browser. Without this, /peers and /join 404 on a refresh or a shared link —
# they work when you navigate to them and break when you reload, which is the
# confusing half of the bug.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # index.html already carries a noindex meta. This is the same instruction
    # in a header, which is what a crawler sees first and what covers the
    # responses that are not HTML.
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Nothing here needs a camera, a microphone, or a location beyond the one
    # the location step asks for explicitly.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    # No other site may show the club inside a frame, where it could dress
    # the sign-in page in its own clothes (an external audit, 2026-10-03,
    # framed /join from another origin). Nothing embeds the club. The second
    # header is the same rule for browsers that predate frame-ancestors.
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
