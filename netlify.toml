# Netlify serves the club at https://thesciclub.com (www redirects to it). The
# old thesciclub.netlify.app address still answers, and the page itself sends
# people on to thesciclub.com (index.html says why it is not a redirect here). Builds `main`. Until 2026-10-03 the domain served the design mock
# from docs/ on GitHub Pages; that mock is gone (CONTEXT.md, "Working model").

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Corepack so the pinned pnpm in package.json is the one that runs.
  NPM_FLAGS = "--version"

# A single-page app: every path is served by index.html and routed in the
# browser. Without this, /peers and /join 404 on a refresh or a shared link —
# they work when you navigate to them and break when you reload, which is the
# confusing half of the bug.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # index.html already carries a noindex meta. This is the same instruction
    # in a header, which is what a crawler sees first and what covers the
    # responses that are not HTML.
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Nothing here needs a camera, a microphone, or a location beyond the one
    # the location step asks for explicitly.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    # What the page may load, and from where. A member's session lives in
    # localStorage, so script that is not the club's own could read it and
    # act as them; this is what stops a script that got in from running, or
    # from sending anything anywhere if it did (a security checklist,
    # 2026-10-03). In order:
    #   script-src   the bundle, the service worker's registration, and the
    #                two inline scripts in index.html by hash: the move off
    #                thesciclub.netlify.app and the appearance before first
    #                paint. Edit either and its hash changes;
    #                src/csp.test.ts says which one and gives the new value.
    #                And Google's sign-in script, the one script from
    #                elsewhere: it lists the Google accounts in the browser
    #                on /join and on Me (src/lib/google-identity.ts,
    #                2026-10-07). Only that file, not all of Google.
    #   style-src    the built stylesheet, and the sign-in script's own. React's style props are set through
    #                the DOM, which a policy does not govern.
    #   img-src      the club's own files, photo previews before upload
    #                (blob:), and photos, chat pictures and organization logos
    #                from Supabase storage.
    #   connect-src  Supabase (REST, auth, storage, and realtime over wss) and
    #                the geocoder the location step asks for a ZIP or a place,
    #                and Google's sign-in, which checks the browser's accounts.
    #   frame-src    YouTube's privacy-enhanced player: a video under a link
    #                plays in place once somebody presses play
    #                (src/routes/chat/link-preview-card.tsx, 2026-10-06). And
    #                Google's sign-in button and account list, which are
    #                Google's page in a frame.
    #   frame-ancestors  no other site may show the club inside a frame, where
    #                it could dress the sign-in page in its own clothes (an
    #                external audit, 2026-10-03, framed /join from another
    #                origin). X-Frame-Options below is the same rule for
    #                browsers that predate frame-ancestors.
    # A deploy preview talks to the same Supabase project, so this holds there
    # too. `pnpm dev` does not read this file.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-Xy2xEANIw9pW886w6DVJgHrrPL/27Q6sFs2Uuu/pmKE=' 'sha256-n2STVZqH8GraCglqUjF3hPzj2VYdFF0SX66U5zowe3M=' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; img-src 'self' blob: https://erijdvqnxavwezsbbojv.supabase.co; font-src 'self'; connect-src 'self' https://erijdvqnxavwezsbbojv.supabase.co wss://erijdvqnxavwezsbbojv.supabase.co https://nominatim.openstreetmap.org https://accounts.google.com/gsi/; frame-src https://www.youtube-nocookie.com https://accounts.google.com/gsi/; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
