<!doctype html>
<!--
  The store app's YouTube player. YouTube refuses a frame whose page is
  capacitor://localhost, so the app frames this page, and YouTube sees
  thesciclub.com. Only ?v=<an 11-character id> is read; nothing else passes.
  Headers: netlify/edge-functions/youtube-embed.ts. Tests: src/embed-youtube.test.ts.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>YouTube video · The SCI Club</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      p {
        margin: 0;
        padding: 16px;
        color: #fff;
        font: 1.125rem/1.5 system-ui, sans-serif;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <p id="refused" hidden>This video can't be played here.</p>
    <script>
      (() => {
        const id = new URLSearchParams(location.search).get('v');
        if (id === null || !/^[A-Za-z0-9_-]{11}$/.test(id)) {
          document.getElementById('refused').hidden = false;
          return;
        }
        const player = document.createElement('iframe');
        player.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&playsinline=1`;
        player.setAttribute('title', 'YouTube video');
        player.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
        player.setAttribute('allowfullscreen', '');
        player.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
        document.body.append(player);
      })();
    </script>
  </body>
</html>
