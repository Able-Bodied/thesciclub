<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The SCI Club — demo</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#102A4C; --navy-hi:#1A3E70; --navy-dp:#0A1D36;
  --gold:#C9A227; --gold-dp:#8A6712; --gold-lt:#F6EDD5;
  --canvas:#F4F6F9; --paper:#fff; --ink:#0F1620; --ink2:#455163; --grey:#7C8899;
  --line:#CBD3DE; --tint:#E4E9F1;
  --head:Archivo,"TeX Gyre Heros","Liberation Sans",sans-serif;
  --body:"Public Sans","Liberation Sans",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#AEB7C2;font-family:var(--body);color:var(--ink);
  display:grid;place-items:center;padding:22px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
input,textarea,select{font:inherit;color:inherit}

/* ---------------------------------------------------------------- phone */
.phone{width:390px;height:844px;background:var(--canvas);border-radius:44px;
  box-shadow:0 30px 70px rgba(10,20,35,.34),0 0 0 11px #10151C,0 0 0 13px #2B333E;
  position:relative;overflow:hidden;display:flex;flex-direction:column}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:29px;
  background:#10151C;border-radius:0 0 18px 18px;z-index:60}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--canvas)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}

/* ---------------------------------------------------------------- header */
.top{padding:46px 18px 0;background:var(--paper);border-bottom:1px solid var(--line);flex:none}
.top.navy{background:var(--navy);border-bottom-color:#22406B}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:38px}
.brand{display:flex;align-items:center;gap:9px}
.brand svg{width:26px;height:39px;display:block}
.brand .wm{font-family:var(--head);font-weight:800;font-size:16.5px;letter-spacing:-.01em;line-height:1}
.brand .wm .t{font-size:11px;color:var(--ink2);letter-spacing:.06em}
.brand .wm .c{color:var(--gold-dp)}
.navy .brand .wm,.hero .brand .wm{color:#fff}
.navy .brand .wm .t,.hero .brand .wm .t{color:#9FB3CD}
.navy .brand .wm .c,.hero .brand .wm .c{color:#E7C868}
.h1{font-family:var(--head);font-weight:800;font-size:25px;letter-spacing:-.02em;margin:2px 0 0}
.iconbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--tint);flex:none}
.iconbtn svg{width:17px;height:17px;stroke:var(--navy);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--gold);border:1.6px solid var(--paper)}

/* segmented pills */
.segs{display:flex;gap:7px;padding:11px 0 12px;overflow-x:auto}
.segs::-webkit-scrollbar{height:0}
.seg{padding:7px 14px;border-radius:999px;background:var(--tint);color:var(--ink2);
  font-size:13.5px;font-weight:600;white-space:nowrap;flex:none}
.seg.on{background:var(--navy);color:#fff}
.navy .seg{background:#1E3A63;color:#B9CADF}
.navy .seg.on{background:var(--gold);color:#2A1E06}

/* ---------------------------------------------------------------- cards */
.pad{padding:14px 16px 18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:11px;
  display:block;width:100%}
.card.flat{border-radius:14px}
.row{display:flex;gap:12px;align-items:flex-start}
.av{width:52px;height:52px;border-radius:16px;flex:none;display:grid;place-items:center;
  font-family:var(--head);font-weight:800;font-size:19px;color:#fff;letter-spacing:.01em;position:relative;overflow:hidden}
.av.lg{width:88px;height:88px;border-radius:26px;font-size:31px}
.av.sm{width:34px;height:34px;border-radius:11px;font-size:13px}
.av i{position:absolute;right:-8px;bottom:-10px;width:38px;height:48px;opacity:.17}
.av.lg i{width:62px;height:78px;right:-14px;bottom:-16px}
.av.sm i{width:24px;height:30px;right:-5px;bottom:-6px}
.av i svg{width:100%;height:100%;display:block;fill:#fff}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 32%}
.nm{display:block;font-family:var(--head);font-weight:800;font-size:16.5px;letter-spacing:-.01em;line-height:1.2}
.nm.lg{font-size:24px}
.meta{display:block;font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.42}
.s{font-size:12.5px;color:var(--grey);line-height:1.42}
.body{font-size:14.2px;line-height:1.52;color:var(--ink);margin:9px 0 0}
.body.m{color:var(--ink2)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:5px 10px;border-radius:999px;background:var(--tint);color:var(--navy);
  font-size:11.8px;font-weight:600;line-height:1.25}
.chip.gold{background:var(--gold-lt);color:var(--gold-dp)}
.chip.on{background:var(--navy);color:#fff}
.chip.out{background:none;border:1px solid var(--line);color:var(--ink2)}

.tagrow{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;color:var(--gold-dp)}
.tagrow.blue{color:var(--navy-hi)}
.tagrow svg{width:13px;height:13px;fill:currentColor}

.btn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;border-radius:13px;
  font-family:var(--head);font-weight:700;font-size:15px;padding:0 16px}
.btn.solid{background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);color:#2A1E06}
.btn.out{border:1.6px solid var(--navy);color:var(--navy)}
.btn.ghost{background:var(--tint);color:var(--navy)}
.btn.link{color:var(--navy);font-weight:700;justify-content:center;min-height:38px}
.btn[disabled]{opacity:.42}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.sec{font-family:var(--head);font-weight:800;font-size:12px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--grey);margin:20px 0 9px}
.sec:first-child{margin-top:4px}
.hr{height:1px;background:var(--line);margin:13px 0}

/* ---------------------------------------------------------------- nav */
.nav{flex:none;padding:7px 8px 22px;background:var(--paper);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px;z-index:40}
.nav b{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 3px;
  font-size:10.2px;font-weight:700;color:var(--grey);border-radius:12px;position:relative}
.nav b.on{color:var(--navy)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav b.on svg{stroke-width:2.3}
.nav b.mid .ni{width:42px;height:42px;border-radius:15px;background:var(--tint);display:grid;
  place-items:center;margin-top:-13px;box-shadow:0 3px 10px rgba(16,42,76,.14)}
.nav b.mid.on .ni{background:var(--navy)}
.nav b.mid.on svg{stroke:#fff}
.nav .pip{position:absolute;top:-9px;right:calc(50% - 22px);width:9px;height:9px;border-radius:50%;
  background:var(--gold);border:2px solid var(--paper)}

/* ---------------------------------------------------------------- misc */
.fab{position:absolute;right:16px;bottom:96px;height:50px;padding:0 19px;border-radius:999px;
  background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;
  font-family:var(--head);font-weight:700;font-size:15px;box-shadow:0 10px 26px rgba(16,42,76,.4);z-index:30}
.fab svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}

.veil{position:absolute;inset:0;background:rgba(10,20,35,.5);z-index:70}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:24px 24px 0 0;
  z-index:71;max-height:88%;display:flex;flex-direction:column;box-shadow:0 -14px 40px rgba(10,20,35,.3)}
.grab{width:38px;height:4.5px;border-radius:3px;background:var(--line);margin:10px auto 4px;flex:none}
.sheet .scroll{padding:6px 18px 0}
.sheet footer{padding:12px 18px 24px;border-top:1px solid var(--line);background:var(--paper);flex:none}

.toast{position:absolute;left:16px;right:16px;bottom:100px;background:var(--navy-dp);color:#fff;
  padding:13px 15px;border-radius:14px;font-size:13.6px;line-height:1.45;z-index:90;
  box-shadow:0 14px 34px rgba(10,20,35,.45)}

.fld{width:100%;border:1.6px solid var(--line);border-radius:13px;padding:13px 14px;font-size:16px;
  background:var(--paper);outline:none;margin-top:9px}
.fld:focus{border-color:var(--navy)}
textarea.fld{min-height:110px;resize:none;line-height:1.5}

.note{margin-top:15px;background:var(--gold-lt);border-left:3px solid var(--gold);border-radius:0 11px 11px 0;
  padding:11px 13px;font-size:12.6px;line-height:1.5;color:#5C4409}
.note b{font-weight:700}

.lstrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 0;border-bottom:1px solid var(--line)}
.lstrow:last-child{border-bottom:0}
.lstrow .gt{margin-left:auto;color:var(--grey);font-size:19px;line-height:1}
.sw{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .16s}
.sw.on{background:var(--navy)}.sw.on i{left:21px}

.hero{background:var(--navy);color:#fff;padding:46px 16px 20px}
.hero .nm,.hero .h1{color:#fff}
.hero .meta{color:#B9CADF}
.hero .chip{background:#22406B;color:#DDE7F3}
.hero .chip.gold{background:#3A2F12;color:#EBD277}

.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}
.stat div{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--head);font-size:20px;font-weight:800;color:var(--navy)}
.stat span{font-size:10.7px;color:var(--grey);font-weight:600;letter-spacing:.03em}

.qmark{width:30px;height:30px;border-radius:10px;background:var(--gold-lt);color:var(--gold-dp);
  display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:16px;flex:none}
.ans{border-left:2.5px solid var(--tint);padding:2px 0 2px 12px;margin-top:11px}

.empty{text-align:center;padding:40px 24px;color:var(--grey);font-size:14px;line-height:1.55}

/* ------------------------------------------------- peer card (BumbleBFF) */
.pcard{position:relative;display:block;width:100%;height:424px;border-radius:26px;overflow:hidden;
  margin-bottom:14px;padding:0;border:0;box-shadow:0 10px 26px rgba(10,20,35,.18)}
.pcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 28%}
.pcard .mono{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--head);
  font-weight:800;font-size:118px;color:#fff;opacity:.13;letter-spacing:-.04em}
.pcard .scrim-t{position:absolute;top:0;left:0;right:0;height:180px;
  background:linear-gradient(#0A1D36E0,#0A1D3600)}
.pcard .scrim-b{position:absolute;bottom:0;left:0;right:0;height:250px;
  background:linear-gradient(#0A1D3600,#0A1D36D9 55%,#0A1D36F2)}
.pcard .pc-top{position:absolute;top:0;left:0;right:0;padding:18px 18px 0;display:block}
.pcard .pc-meta,.phero .pc-meta{display:block;margin-top:7px;font-size:13.5px;color:#D3DFEE;line-height:1.45}
.pcard .pc-bot{position:absolute;left:0;right:0;bottom:0;padding:0 18px 18px;display:block}
.pcard .pc-bio{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  font-size:13.6px;line-height:1.5;color:#E7EEF7}
.mentorbadge{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 5px;border-radius:999px;
  background:#FFFFFFF0;color:var(--navy);font-size:12px;font-weight:800;line-height:1}
.orgmark{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;
  background:linear-gradient(140deg,#8A6712,#C9A227);color:#fff;font-family:var(--head);
  font-weight:800;font-size:8.5px;letter-spacing:.02em}
.wchip{display:inline-block;padding:6px 12px;border-radius:999px;background:#FFFFFFEB;color:var(--navy);
  font-size:12px;font-weight:700;line-height:1.2}
.pcard .pc-fab{position:absolute;right:16px;bottom:118px;width:52px;height:52px;border-radius:50%;
  background:var(--gold);display:grid;place-items:center;box-shadow:0 6px 18px rgba(10,20,35,.4)}
.pcard .pc-fab svg{width:22px;height:22px;stroke:#2A1E06;fill:none;stroke-width:2;stroke-linejoin:round}

.phero{position:relative;height:300px;overflow:hidden}
.phero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 26%}
.phero .mono{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--head);
  font-weight:800;font-size:104px;color:#fff;opacity:.13}
.phero .scrim-b{position:absolute;left:0;right:0;bottom:0;height:190px;
  background:linear-gradient(#0A1D3600,#0A1D36CC 60%,#102A4C)}
.pback{position:absolute;top:46px;left:16px;z-index:2;color:#fff;font-size:14px;font-weight:700;
  background:#0A1D3699;padding:7px 13px;border-radius:999px;backdrop-filter:blur(4px)}
.phero-txt{position:absolute;left:0;right:0;bottom:0;padding:0 18px 14px}

/* ------------------------------------------------- photo post */
.card.post{padding:0;overflow:hidden}
.ph{margin-top:12px;background:var(--tint);aspect-ratio:400/260;position:relative;overflow:hidden}
.ph svg,.ph img{width:100%;height:100%;display:block;object-fit:cover}
.ph.mine{display:grid;place-items:center;color:var(--grey);font-size:13px;font-weight:600;
  background:repeating-linear-gradient(45deg,#EAEFF5,#EAEFF5 10px,#E1E8F1 10px,#E1E8F1 20px)}

/* ------------------------------------------------- event card (PeerConnect) */
.card.ecard{position:relative;padding:14px}
.ecard .x{position:absolute;top:9px;right:10px;width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;color:var(--grey);font-size:14px;background:var(--canvas);z-index:2}
.datetile{flex:none;width:58px;border-radius:14px;background:var(--tint);padding:8px 0 9px;
  text-align:center;display:block}
.datetile i{display:block;font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.09em;color:var(--ink2)}
.datetile b{display:block;font-family:var(--head);font-size:23px;font-weight:800;color:var(--navy);line-height:1.15}
.datetile u{display:block;text-decoration:none;font-size:10.5px;font-weight:800;letter-spacing:.09em;color:var(--ink2)}
.cnt{display:block;margin-top:8px;font-size:13px;font-weight:700;color:var(--navy)}
.prf{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:12.6px;font-weight:600;color:var(--ink2)}

/* ------------------------------------------------- photo picker */
.picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.slot{aspect-ratio:1;border-radius:14px;border:2px dashed var(--line);display:grid;place-items:center;
  color:var(--grey);background:var(--canvas)}
.slot svg{width:22px;height:22px}
.slot.on{border-style:solid;border-color:var(--navy);background:var(--navy);color:#fff}
.qlab{display:flex;align-items:baseline;gap:8px;font-family:var(--head);font-weight:800;font-size:15px;
  letter-spacing:-.01em;margin-bottom:9px}
.qlab span{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--gold-dp);
  background:var(--gold-lt);padding:2px 7px;border-radius:6px;flex:none}

/* ---------------------------------------------------------------- chat */
.roomico{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:var(--tint);color:var(--c,var(--navy));font-size:18px;line-height:1}
.lastmsg{display:block;margin-top:5px;font-size:12.6px;color:var(--ink2);line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catlabel{font-family:var(--head);font-weight:800;font-size:11.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--c);margin:16px 0 8px;display:flex;align-items:center;gap:7px}
.catlabel::before{content:"";width:11px;height:11px;border-radius:3px;background:var(--c)}
.card.cat{border-left:4px solid var(--c);border-radius:6px 17px 17px 6px}
.card.topic{padding:13px 14px}
.tstats{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;font-size:12.4px;color:var(--grey)}
.tstats b{font-family:var(--head);font-weight:800;color:var(--navy);font-size:13.4px}
.tstats i{font-style:normal;margin-right:9px}
.sortbar{display:flex;align-items:center;gap:5px;padding:11px 0 9px;border-top:1px solid var(--line);
  margin-top:13px}
.sortb{padding:5px 10px;border-radius:8px;font-size:12.3px;font-weight:700;color:var(--ink2);background:var(--tint)}
.sortb.on{background:var(--navy);color:#fff}
.fp{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:10px}
.pnum{font-size:11.5px;color:var(--grey);font-weight:700;flex:none}
.daysep{text-align:center;font-size:11.5px;color:var(--grey);font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;margin:2px 0 14px;position:relative}
.msg{display:flex;gap:9px;margin-bottom:14px;align-items:flex-start}
.msg.me{flex-direction:column;align-items:flex-end}
.mt{font-size:11.4px;color:var(--grey);font-weight:600;margin-top:4px}
.bub{background:var(--paper);border:1px solid var(--line);border-radius:4px 15px 15px 15px;
  padding:10px 13px;font-size:14px;line-height:1.5;max-width:250px}
.msg.me .bub{background:var(--navy);color:#fff;border-color:var(--navy);border-radius:15px 15px 4px 15px}
.composer{flex:none;display:flex;gap:9px;align-items:center;padding:10px 14px 14px;
  background:var(--paper);border-top:1px solid var(--line)}
.cin{flex:1;min-width:0;border:1.6px solid var(--line);border-radius:999px;padding:11px 15px;
  font-size:15px;outline:none;background:var(--canvas)}
.cin:focus{border-color:var(--navy);background:#fff}
.sendbtn{width:44px;height:44px;border-radius:50%;background:var(--navy);display:grid;place-items:center;flex:none}
.sendbtn svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linejoin:round}
.sendbtn[disabled]{opacity:.35}

/* progress ring on Me */
.ring{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--gold) calc(var(--p)*1%), var(--tint) 0)}
.ring b{width:40px;height:40px;border-radius:50%;background:var(--paper);display:grid;place-items:center;
  font-family:var(--head);font-weight:800;font-size:14px;color:var(--navy)}
.ring b i{font-style:normal;font-size:9px}
.chip.dim{opacity:.4}

/* onboarding */
.lock{text-align:center;padding:34px 0 4px}
.welcome .scroll{display:flex;flex-direction:column;justify-content:center}
.lock .sign{width:126px;margin:0 auto}
.hero1{font-family:var(--head);font-size:31px;font-weight:800;letter-spacing:-.03em;
  margin:30px 0 0;line-height:1.14;color:var(--ink)}
.hero1 em{font-style:normal;color:var(--gold-dp)}
.hero2{font-family:var(--head);font-size:15.5px;font-weight:700;color:var(--navy);
  margin:17px 0 0;line-height:1.4}
.hero3{font-size:14.4px;color:var(--ink2);line-height:1.62;margin:14px 0 0}
.fine{font-size:12.4px;color:var(--grey);line-height:1.5;margin:14px 0 0}
.prog{padding:44px 16px 0;flex:none}
.track{height:4px;background:var(--tint);border-radius:3px;overflow:hidden;margin-top:7px}
.track i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .22s}
.back{font-size:14px;font-weight:600;color:var(--ink2);padding:12px 0 2px}
.cta{padding:10px 16px 16px;background:var(--canvas);flex:none}
h2.q{font-family:var(--head);font-size:23px;font-weight:800;letter-spacing:-.02em;margin:12px 0 0;line-height:1.25}
p.sub{font-size:14.4px;color:var(--ink2);line-height:1.55;margin:9px 0 4px}

    {by:"Victor",when:"Mon 08:14",t:"Three years in and I still cannot get my programme under 90 minutes. Is that just my level or am I doing something wrong? Every time I ask a professional I get told 45 minutes like it is a fact."},

/* ------------------------------------------------------------ avatar */
const PAL = [["#102A4C","#1A3E70"],["#1A3E70","#2C5590"],["#8A6712","#C9A227"],
             ["#274B7A","#3C6299"],["#5C4409","#8A6712"],["#16355C","#26507F"]];
function av(m, cls){
  if (typeof m === "string") m = mem(m);
  if (!m) return meAv(cls);
  const p = PAL[(m.id*5+3) % PAL.length];
  const ini = m.n.slice(0,2).toUpperCase();
  /* the published headshot sits on top of the monogram tile; if it will not
     load (offline, or the CDN is blocked) the tile underneath is the design */
  return `<span class="av ${cls||""}" style="background:linear-gradient(140deg,${p[0]},${p[1]})">
    <i><svg viewBox="0 0 79.45 100"><use href="#chair"/></svg></i>${esc(ini)}
    ${m.ph?`<img src="${esc(m.ph)}" alt="" loading="lazy" onerror="this.remove()">`:""}</span>`;
}
function meAv(cls){
  return `<span class="av ${cls||""}" style="background:linear-gradient(140deg,#0A1D36,#1A3E70)">
    <i><svg viewBox="0 0 79.45 100"><use href="#chair"/></svg></i>${esc((S.new.name||"You").slice(0,2).toUpperCase())}</span>`;
}

const BRAND = `<span class="brand">${sign(26)}<span class="wm"><span class="t">THE</span> SCI <span class="c">CLUB</span></span></span>`;

function head(title, opts){
  opts = opts || {};
  return `<div class="top">
    <div class="tbar">${BRAND}
      <div style="display:flex;gap:8px">
        ${opts.search?`<button class="iconbtn" data-act="search">${I.srch}</button>`:""}
        ${opts.filter?`<button class="iconbtn" style="position:relative" data-act="${opts.filter}">${I.slide}${
          opts.fcount?'<span class="dot"></span>':""}</button>`:""}
        <button class="iconbtn" style="position:relative" data-act="bell">${I.bell}<span class="dot"></span></button>
      </div>
    </div>
    <div class="h1">${esc(title)}</div>
    ${opts.segs||""}
  </div>`;
}
function segs(list, cur, act){
  return `<div class="segs">${list.map(s=>
    `<button class="seg ${s[0]===cur?"on":""}" data-${act}="${esc(s[0])}">${esc(s[1])}</button>`).join("")}</div>`;
}

/* ============================================================ HOME */
const QCATS = ["Bladder & bowel","Work & school","Intimacy","Equipment","Aging with SCI",
               "Adaptive sport","Mental health","Travel","Caregivers","Newly injured","Something else"];
const FCATS = ["Equipment","Adaptive sport","Travel","Independence","Bladder & bowel",
               "Work & school","Intimacy","Aging with SCI","Newly injured"];

function hcount(){ return S.hfilter.cat.length + S.hfilter.city.length; }
function feedOwner(f){
  if (f.k==="q"){ const x=S.q.find(v=>v.id===f.id); return x&&x.by?mem(x.by):null; }
  if (f.k==="post"){ const p=POSTS.find(v=>v.id===f.id); return p&&p.by?mem(p.by):null; }
  if (f.k==="peer") return mem(f.n);
  return null;
}
function feedCat(f){
  if (f.k==="q"){ const x=S.q.find(v=>v.id===f.id); return x?x.cat:""; }
  if (f.k==="post"){ const p=POSTS.find(v=>v.id===f.id); return p?p.cat||"":""; }
  if (f.k==="ev") return (EV[f.id].cat||[]).join(" ");
  return "";
}
function hmatch(f){
  const h = S.hfilter;
  if (h.cat.length && !h.cat.some(c => feedCat(f).toLowerCase().includes(c.toLowerCase()))) return false;
  if (h.city.length){ const o = feedOwner(f);
    const city = f.k==="ev" ? EV[f.id].city : (o?o.city:"");
    if (!h.city.includes(city)) return false; }
  return true;
}
function homePage(){
  const sg = [["all","Everything"],["q","Questions"],["post","Posts"],["ev","Events"],["peer","People"]];
  const list = S.feed.filter(f => (S.homeSeg==="all" || f.k===S.homeSeg) && hmatch(f));
  return head("Home", {search:true, filter:"hfilters", fcount:hcount(), segs: segs(sg, S.homeSeg, "homeseg")})
  + `<div class="scroll"><div class="pad">
    <button class="card" data-act="compose" style="border-style:dashed;border-color:#B7C2D2;background:#FBFCFD">
      <div class="row" style="align-items:center">${meAv("sm")}
        <span style="flex:1"><span class="nm" style="font-size:14.5px">Ask something, or share something</span>
        <span class="s" style="margin-top:2px">No question is too basic, too personal or too weird.</span></span>
      </div></button>
    ${hcount()?`<div class="chips" style="margin:0 0 11px">${
      S.hfilter.cat.concat(S.hfilter.city).map(c=>`<span class="chip on">${esc(c)}</span>`).join("")}
      <button class="chip out" data-act="clearh">Clear</button></div>`:""}
    ${list.map(feedItem).join("")}
    ${list.length?"":`<div class="empty">Nothing matches that yet.<br>Try widening the filter.</div>`}
    <div style="height:6px"></div>
  </div></div>`;
}
function feedItem(f){
  if (f.k==="q"){ const x = S.q.find(v=>v.id===f.id); return x?qCard(x):""; }
  if (f.k==="post") return postCard(POSTS.find(p=>p.id===f.id));
  if (f.k==="ev")   return evCard(EV[f.id]);
  if (f.k==="peer") return peerSuggest(mem(f.n));
  return "";
}
function qCard(x){
  const asker = x.anon ? null : (x.by ? mem(x.by) : null);
  const top = x.a[0];
  return `<button class="card" data-q="${x.id}">
    <div class="tagrow blue"><span style="display:flex">${I.ask}</span><span>Question · ${esc(x.cat)}</span></div>
    <div class="nm" style="margin-top:8px;font-size:16px;line-height:1.32">${esc(x.q)}</div>
    <div class="meta" style="margin-top:7px">${x.anon ? `Asked anonymously · ${esc(x.when)}`
      : asker ? `${esc(asker.n)} · ${esc(asker.lvl)} · ${esc(x.when)}`
              : `${esc(S.new.name||"You")} · ${esc(x.when)}`}</div>
    ${top?`<div class="ans"><div class="row" style="gap:9px;align-items:center">
        ${av(top.by,"sm")}<span class="s" style="font-weight:600;color:var(--ink2)">${esc(top.by)} · ${esc(mem(top.by).lvl)}</span></div>
      <div class="body m" style="margin-top:6px">${esc(top.t)}</div></div>`:""}
    <div class="s" style="margin-top:10px;font-weight:600;color:var(--navy)">
      ${x.a.length} ${x.a.length===1?"answer":"answers"} →</div>
  </button>`;
}
function photoBox(p){
  if (p.scene) return `<div class="ph"><svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice">${SCENE[p.scene]}</svg></div>`;
  if (p.portrait && p.by){ const m = mem(p.by);
    return `<div class="ph"><img src="${esc(m.ph)}" alt="" loading="lazy" onerror="this.parentNode.remove()"></div>`; }
  if (p.mine && p.photo) return `<div class="ph mine"><span>Your photo</span></div>`;
  return "";
}
function postCard(p){
  const mine = !p.by, k = "p"+p.id;
  const m = mine ? null : mem(p.by);
  return `<div class="card post">
    ${mine
      ? `<div class="row" style="align-items:center;padding:13px 14px 0">${meAv("sm")}
          <span style="flex:1;min-width:0"><span class="nm" style="font-size:14.5px">${esc(S.new.name||"You")}</span>
          <span class="s">${esc([S.new.lvl, S.new.city||"San Jose", p.when].filter(Boolean).join(" · "))}</span></span>
          <span class="chip gold">You</span></div>`
      : `<button class="row" data-m="${m.id}" style="width:100%;align-items:center;padding:13px 14px 0">${av(m,"sm")}
          <span style="flex:1;min-width:0"><span class="nm" style="font-size:14.5px">${esc(m.n)}</span>
          <span class="s">${esc([m.lvl,m.city,p.when].filter(Boolean).join(" · "))}</span></span></button>`}
    ${photoBox(p)}
    <div style="padding:0 14px 13px">
      <div class="body" style="margin-top:11px">${esc(p.t)}</div>
      ${mine?"":`<div class="hr"></div>
      <div style="display:flex;gap:9px">
        <button class="chip ${S.thanks[k]?"on":"out"}" data-thank="${k}">${S.thanks[k]?"Thanked":"This helped"}</button>
        <button class="chip out" data-dm="${esc(m.n)}">Message ${esc(m.n)}</button>
      </div>`}
    </div>
  </div>`;
}
function peerSuggest(m){
  return `<button class="card" data-m="${m.id}" style="border-color:#B8C6DA;background:#FAFCFF">
    <div class="tagrow blue">${I.spark}<span>Worth meeting</span></div>
    <div class="row" style="margin-top:10px">${av(m)}
      <div style="flex:1;min-width:0">
        <div class="nm">${esc(m.n)}</div>
        <div class="meta">${esc([`${m.lvl} ${m.comp.toLowerCase()}`, m.age, m.city].join(" · "))}</div>
        <div class="s" style="margin-top:3px">${esc(m.field||"—")}</div>
      </div></div>
    <div class="chips">${m.top.slice(0,3).map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>
  </button>`;

function qPage(id){
  const x = S.q.find(v=>v.id===id);
  const asker = x.anon ? null : (x.by ? mem(x.by) : null);
  return `<div class="top"><div class="tbar"><button class="back" data-act="back">← Home</button></div>

  <div class="scroll"><div class="pad">

      <span class="gt">›</span></div></button>`:""}
    <div class="sec">${x.a.length} ${x.a.length===1?"answer":"answers"}</div>
    ${x.a.map((a,i)=>{ const m = mem(a.by), k = id+"-"+i;
      return `<div class="card">
        <button class="row" data-m="${m.id}" style="width:100%;align-items:center">${av(m,"sm")}
          <span><span class="nm" style="font-size:14.5px">${esc(m.n)}</span>

        <div class="hr"></div>

          <button class="chip ${S.thanks[k]?"on":"out"}" data-thank="${k}">${S.thanks[k]?"Thanked":"This helped"}</button>

/* ============================================================ PEERS */
const GRPS = ["Cervical","Thoracic","Lumbar"];
function matches(m){
  const f = S.filter;
  if (f.grp.length && !f.grp.includes(m.grp)) return false;
  if (f.city.length && !f.city.includes(m.city)) return false;
  if (f.topic.length && !f.topic.some(t => m.top.concat(m.int).some(v=>v.toLowerCase().includes(t.toLowerCase())))) return false;
  if (S.search){
    const hay = [m.n,m.city,m.lvl,m.field,m.edu,...m.top,...m.int,...m.dev,m.fn].join(" ").toLowerCase();
    if (!hay.includes(S.search.toLowerCase())) return false;
  }
  if (S.peerSeg==="near") return ["San Jose","Santa Clara","Sunnyvale","Campbell","Fremont"].includes(m.city);
  if (S.peerSeg==="mentors") return !!m.mentor;
  return true;
}
function peersPage(){
  const list = M.filter(matches);
  const sg = [["all","Everyone"],["near","Near me"],["mentors","Mentors only"]];
  const n = S.filter.grp.length+S.filter.topic.length+S.filter.city.length;
  return head("Peers", {filter:"filters", fcount:n, search:true, segs: segs(sg, S.peerSeg, "peerseg")})
  + `<div class="scroll"><div class="pad">
    ${S.search?`<div class="chips" style="margin:0 0 11px"><button class="chip on" data-act="clearf">“${esc(S.search)}” ✕</button></div>`:""}
    <div class="s" style="margin-bottom:12px">${list.length} of ${M.length} members${
      S.peerSeg==="mentors"?" · every member seeded here came from the NorCal SCI mentor directory"
      : S.peerSeg==="all"&&!S.search?" · everyone here came in through NorCal SCI":""}</div>
    ${list.map(peerCard).join("")}
    ${list.length?"":`<div class="empty">Nobody matches that yet.<br>Try widening the filters.</div>`}
    <div style="height:6px"></div>
  </div></div>`;
}
function peerCard(m){
  const p = PAL[(m.id*5+3) % PAL.length];
  return `<button class="pcard" data-m="${m.id}" style="background:linear-gradient(150deg,${p[0]},${p[1]})">
    <span class="mono">${esc(m.n.slice(0,2).toUpperCase())}</span>
    <img src="${esc(m.ph)}" alt="" loading="lazy" onerror="this.remove()">
    <span class="scrim-t"></span><span class="scrim-b"></span>
    <span class="pc-top">
      <span class="nm lg" style="color:#fff;font-size:28px">${esc(m.n)}</span>
      <span class="pc-meta">${esc(`${m.lvl} ${m.comp.toLowerCase()} · ${m.age} · ${m.city}`)}</span>
    </span>
    <span class="pc-bot">
      ${m.mentor?`<span class="mentorbadge"><span class="orgmark">${esc(orgOf(m).k)}</span>Peer mentor</span>`:""}
      <span class="chips" style="margin-top:10px">${m.top.slice(0,3).map(t=>
        `<span class="wchip">${esc(t)}</span>`).join("")}</span>
    </span>
    <span class="pc-fab" data-dm="${esc(m.n)}">${I.send}</span>
  </button>`;
}
function orgOf(m){ return ORGS.find(o=>o.n===(m.aff||[])[0]) || ORGS[0]; }

      <div class="btn2">

      ${m.dev.length?`<div class="sec">Uses day to day</div>

        `<button class="chip gold" data-topic="${esc(t)}">${esc(t)}</button>`).join("")}</div>`:""}

      <div class="sec">Details</div>
      <div class="card">
        ${[["Independence",m.ind],["Work",m.job],["Field",m.field],["Education",m.edu],
           ["Languages",(m.lang||[]).join(", ")]]
          .filter(r=>r[1]).map(r=>`<div class="lstrow"><span style="flex:none;width:104px" class="s">${esc(r[0])}</span>
            <span style="font-size:13.6px;line-height:1.42">${esc(r[1])}</span></div>`).join("")}
      </div>

      <div class="sec">Also a member of</div>
      ${(m.aff||[]).map(a=>{const o = ORGS.find(o=>o.n===a);
        return `<button class="card flat" ${o?`data-org="${o.id}"`:""} style="padding:12px">
          <div class="row" style="align-items:center;gap:11px">
            <span class="av sm" style="background:linear-gradient(140deg,#8A6712,#C9A227);font-size:11px">
              ${esc((o?o.k:a.slice(0,2)).slice(0,3))}</span>
            <span class="nm" style="font-size:14.5px">${esc(a)}</span>
            ${o?`<span class="gt" style="margin-left:auto">›</span>`:""}
          </div></button>`}).join("")}

      <div class="note">Everything here is what ${esc(m.n)} chose to publish in the NorCal SCI mentor
        directory. The club never shows a phone number, an address or an email — first contact
        always goes through a message.</div>
      <div style="height:12px"></div>
    </div>
  </div>`;
}

/* ============================================================ EVENTS */
function evPage(){
  const sg = [["upcoming","Upcoming"],["going","I'm going"],["sport","Adaptive sport"],["online","Online"],["orgs","Organizations"]];
  if (S.evSeg==="orgs") return head("Events",{segs:segs(sg,S.evSeg,"evseg")}) + orgList();
  let list = EV.slice();
  if (S.evSeg==="going") list = list.filter(e=>S.new.going.includes(e.id));
  if (S.evSeg==="sport") list = list.filter(e=>e.cat.includes("Adaptive sport"));
  if (S.evSeg==="online") list = list.filter(e=>e.city==="Online");
  return head("Events",{segs:segs(sg,S.evSeg,"evseg")})
  + `<div class="scroll"><div class="pad">
    <div class="chips" style="margin:0 0 13px">
      <button class="chip on">For you ▾</button>
      <button class="chip out">Northern California</button>
      <button class="chip out">This month</button></div>
    ${list.map(evCard).join("")}

/* ============================================================ CHAT
   Direct and group threads are chat. Discussion rooms are a forum,
   organised the way Discourse organises one: a category list, then a
   topic list with replies / views / activity you can sort by, then
   the topic itself. */
const room  = id => S.rooms.find(r=>r.id===id);
const group = id => S.groups.find(g=>g.id===id);
const dm    = id => S.dms.find(d=>d.id===id);
const topicOf = (r,tid) => r.threads.find(t=>t.id===tid);
function roomFor(topic){
  const hit = ROOM_MAP.find(([re]) => re.test(topic||""));
  return hit ? hit[1] : null;
}
function evGroup(e){
  let g = S.groups.find(g=>g.ev===e.id);
  if (!g){
    g = {id:"ev"+e.id, ev:e.id, n:e.t, icon:"◎", sub:e.when, members:e.going.slice(),
         msgs:[{by:e.going[0], when:"Today", t:"See you Saturday. Anyone who wants a lift from the South Bay, say so here."}]};
    S.groups.push(g);
  }
  return g.id;
}
const lastOf = t => t.msgs[t.msgs.length-1];
const CATCOL = {Body:"#1A3E70", Life:"#8A6712", Kit:"#2F6B57"};

function chatPage(){
  const sg = [["all","All"],["dm","Direct"],["grp","Groups"],["room","Rooms"]];
  const rows = [];
  if (S.chatSeg==="all"||S.chatSeg==="dm")  S.dms.forEach(d=>rows.push({k:"dm",o:d}));
  if (S.chatSeg==="all"||S.chatSeg==="grp") S.groups.forEach(g=>rows.push({k:"grp",o:g}));
  const showRooms = S.chatSeg==="all" || S.chatSeg==="room";

  return head("Chat",{search:true, segs:segs(sg,S.chatSeg,"chatseg")})
  + `<div class="scroll"><div class="pad">
    ${rows.length?`<div class="card" style="padding:2px 14px">${rows.map(chatRow).join("")}</div>`
      : S.chatSeg!=="room" ? `<div class="empty">No conversations yet.<br>Open a room below, or message a peer.</div>`:""}

    ${showRooms?`
      <div class="sec">Discussion rooms</div>
      <div class="s" style="margin:-4px 0 12px">Open to every member, with the whole history from
        before you joined. Nothing here is public.</div>
      ${["Body","Life","Kit"].map(c=>{
        const rs = S.rooms.filter(r=>r.cat===c); if (!rs.length) return "";
        return `<div class="catlabel" style="--c:${CATCOL[c]}">${esc(c)}</div>
        ${rs.map(r=>`<button class="card cat" data-room="${r.id}" style="--c:${CATCOL[c]}">
          <div class="row" style="align-items:flex-start;gap:11px">
            <span class="roomico">${esc(r.icon)}</span>
            <span style="flex:1;min-width:0">
              <span class="nm" style="font-size:15px">${esc(r.n)}${
                S.joined.includes(r.id)?`<span class="chip gold" style="margin-left:7px;vertical-align:2px">Joined</span>`:""}</span>
              <span class="s" style="display:block;margin-top:3px;line-height:1.45">${esc(r.d)}</span>
              <span class="s" style="display:block;margin-top:6px;color:var(--navy);font-weight:600">
                ${r.threads.length} topics · ${r.posts} posts · ${r.members} members</span>
            </span></div></button>`).join("")}`}).join("")}
      `:""}
    <div style="height:8px"></div>
  </div></div>`;
}
function chatRow(r){
  const o = r.o, last = lastOf(o);
  const title = r.k==="dm" ? o.with : o.n;
  const sub   = r.k==="dm" ? `${mem(o.with).lvl} · ${mem(o.with).city}` : o.sub || "";
  const icon  = r.k==="dm" ? av(o.with,"sm") : `<span class="roomico">${esc(o.icon)}</span>`;
  const attr  = r.k==="dm" ? `data-dmid="${esc(o.id)}"` : `data-group="${esc(o.id)}"`;
  return `<button class="lstrow" ${attr} style="width:100%">${icon}
    <span style="flex:1;min-width:0">

      <span class="s" style="display:block;margin-top:1px">${esc(sub)}</span>

    <span class="s" style="flex:none;align-self:flex-start">${esc(last?last.when.replace(/^Today /,""):"")}</span>
  </button>`;
}

const SORTS = [["last","Activity"],["replies","Replies"],["views","Views"]];
function roomPage(id){

  const ts = r.threads.slice().sort((a,b)=>
    S.roomSort==="replies" ? b.replies-a.replies :
    S.roomSort==="views"   ? b.views-a.views : a.ago-b.ago);
  return `<div class="screen">
    <div class="top" style="padding-bottom:0">
      <button class="back" data-act="back" style="padding:0 0 8px">← Chat</button>

          <span class="nm" style="font-size:18px">${esc(r.n)}</span>
          <span class="s" style="display:block;margin-top:3px;line-height:1.45">${esc(r.d)}</span>
          <span class="s" style="display:block;margin-top:5px;color:var(--navy);font-weight:600">

}
function topicRow(r,t){
  const people = [...new Set(t.posts.map(p=>p.by))].slice(0,4);

function topicPage(rid, tid){

  return `<div class="screen">

/* ------------------------------------------------------------ dates */
const MON = ["January","February","March","April","May","June","July",
             "August","September","October","November","December"];
function dobParts(v){
  if (!v) return null;
  const p = String(v).split("-");
  if (p.length!==3) return null;
  const y=+p[0], mo=+p[1], d=+p[2];
  if (!y||!mo||!d||y<1900||mo>12||d>31) return null;
  return {y, mo, d};
}
function ageOf(v){
  const p = dobParts(v); if (!p) return null;
  const now = new Date(2026, 8, 1);
  let a = now.getFullYear()-p.y;
  if (now.getMonth()+1 < p.mo || (now.getMonth()+1===p.mo && now.getDate() < p.d)) a--;
  return a>0 && a<120 ? a : null;
}
function dobLabel(v){ const p=dobParts(v); return p ? `${MON[p.mo-1]} ${p.d}, ${p.y}` : ""; }
function bdayLabel(v){
  const p = dobParts(v); if (!p) return "";
  const now = new Date(2026, 8, 1);
  let next = new Date(now.getFullYear(), p.mo-1, p.d);
  if (next < now) next = new Date(now.getFullYear()+1, p.mo-1, p.d);
  const days = Math.round((next-now)/86400000);
  if (days===0) return "Birthday today";
  if (days<=30) return `Birthday in ${days} day${days===1?"":"s"}`;
  return `${MON[p.mo-1]} ${p.d} birthday`;
}

/* ============================================================ profile flow */
function pqs(sc){ return sc.keys.map(k=>PQ[k]).filter(p=>!p.onlyIf || p.onlyIf(S.prof)); }
function answered(p){
  const v = S.prof[p.key];
  return Array.isArray(v) ? v.length>0 : (v!=null && String(v).trim()!=="");
}
/* a screen advances itself only when every question on it is a single
   choice, or a capped multi-select that has reached its cap */
function autoReady(sc){
  const qs = pqs(sc);
  if (!qs.length) return false;
  return qs.every(p =>
    p.kind==="one" ? answered(p)
    : p.kind==="many" && p.max ? (S.prof[p.key]||[]).length>=p.max
    : false);
}
function profDone(){
  const need = [];
  PSCREENS.forEach(sc => pqs(sc).forEach(p=>need.push(p)));
  const done = need.filter(answered);
  return {done:done.length, total:need.length, pct:Math.round(done.length/need.length*100)};
}
function profView(){
  const i = Math.min(S.profStep, PSCREENS.length-1), sc = PSCREENS[i], qs = pqs(sc);
  const pd = profDone();
  return `<div class="screen">

        return `<div style="margin-top:${n?20:16}px">

      <button class="btn gold" style="width:100%" data-prof="next">
        ${i===PSCREENS.length-1?"Finish":"Continue"}</button>

    </footer>
  </div>`;

        <button class="btn out" data-act="howto">How to get one</button>
      </div>
      <p class="fine" style="text-align:center;margin:11px 0 2px">Members only. Nothing inside the club is public.</p>
    </footer>
  </div>`;
}
function setupView(){
  if (STEP[S.step]==="welcome") return welcomeView();
  const n = S.step-1, show = S.step>=2, last = STEP[S.step]==="photo";
  return `<div class="screen">
    ${show?`<div class="prog"><div style="display:flex;justify-content:space-between;align-items:center">
        <span class="s" style="font-weight:700;color:var(--navy)">THE SCI CLUB</span>
        <span class="s">Step ${n} of 5</span></div>
      <div class="track"><i style="width:${n/5*100}%"></i></div></div>`:`<div style="height:44px"></div>`}
    <div class="scroll" style="padding:0 18px 12px">
      <button class="back" data-setup="back">← Back</button>
      ${setupBody()}<div style="height:16px"></div>
    </div>
    <footer class="cta">
      <button class="btn gold" style="width:100%" data-setup="next" ${canNext()?"":"disabled"}>
        ${last?"Enter the club":"Continue"}</button>
      ${last?`<button class="btn link" style="width:100%;margin-top:2px" data-setup="skip">Skip for now</button>`:""}
    </footer>
  </div>`;
}

/* ============================================================ render */
function render(){
  const a = $("#app");
  if (S.setup){ a.innerHTML = setupView(); return; }
  if (S.view && S.view.k==="prof"){ a.innerHTML = profView(); return; }
  if (S.view && S.view.k==="room"){ a.innerHTML = roomPage(S.view.id); return; }
  if (S.view && S.view.k==="topic"){
    a.innerHTML = topicPage(S.view.rid, S.view.tid);
    const t = $("#thread"); if (t) t.scrollTop = t.scrollHeight;
    if (S.focusMsg){ const f=$("#msg"); if (f){ f.focus(); f.setSelectionRange(f.value.length,f.value.length); } }
    return;
  }
  if (S.view && (S.view.k==="grp"||S.view.k==="dm")){
    a.innerHTML = threadPage(S.view.k, S.view.id);
    const t = $("#thread"); if (t) t.scrollTop = t.scrollHeight;
    if (S.focusMsg){ const f=$("#msg"); if (f){ f.focus(); f.setSelectionRange(f.value.length,f.value.length); } }
    return;
  }
  let body;
  if (S.view && S.view.k==="q")        body = qPage(S.view.id);
  else if (S.view && S.view.k==="m")   body = peerPage(S.view.id);
  else if (S.view && S.view.k==="ev")  body = evDetail(S.view.id);
  else if (S.view && S.view.k==="org") body = orgPage(S.view.id);
  else if (S.tab==="home")   body = homePage();
  else if (S.tab==="peers")  body = peersPage();
  else if (S.tab==="chat")   body = chatPage();
  else if (S.tab==="events") body = evPage();
  else                       body = mePage();

  a.innerHTML = `<div class="screen">${body}
    ${S.tab==="home"&&!S.view?`<button class="fab" data-act="compose">${I.plus}Post</button>`:""}
    ${nav()}
    ${S.toast?`<div class="toast">${esc(S.toast)}</div>`:""}
    ${sheet()}</div>`;
}
let tt;
function toast(m){ S.toast=m; render(); clearTimeout(tt); tt=setTimeout(()=>{S.toast=null;render();},3400); }

function openDM(name){
  let d = S.dms.find(d=>d.with===name);
  if (!d){ d = {id:"dm-"+name.toLowerCase(), with:name, msgs:[]}; S.dms.unshift(d); }
  S.view = {k:"dm", id:d.id}; S.tab="chat"; S.draft=""; render();
}
function openTopic(t){
  const id = roomFor(t);
  if (id){
    if (!S.joined.includes(id)) S.joined.push(id);
    S.view={k:"room",id}; S.tab="chat"; S.draft=""; render();
    toast(`“${t}” lives in ${room(id).n}. Full history, open to all members.`);
  } else {
    S.search = t; S.tab="peers"; S.peerSeg="all"; S.view=null; render();
    toast(`No room for “${t}” yet — showing members who mention it.`);
  }
}

/* ============================================================ events */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-act],[data-tab],[data-q],[data-m],[data-ev],[data-org],[data-homeseg],[data-chatseg],[data-kind],[data-peerseg],[data-evseg],[data-f],[data-h],[data-cat],[data-search],[data-dm],[data-dmid],[data-room],[data-topicid],[data-sort],[data-newtopic],[data-group],[data-topic],[data-thank],[data-pic],[data-dismiss],[data-go],[data-int],[data-setup],[data-newpick],[data-askthem],[data-follow],[data-send],[data-join],[data-prof],[data-prof-pick]");
  if (!t) return;
  const d = t.dataset;

  /* ---- profile completion flow */
  if (d.profPick){
    const [key,val,kind,max] = d.profPick.split("|");
    if (kind==="many"){
      const cur = S.prof[key] || [];
      if (cur.includes(val)) S.prof[key] = cur.filter(v=>v!==val);
      else if (!+max || cur.length < +max) S.prof[key] = cur.concat([val]);
      else { toast(`Pick up to ${max} — deselect one first.`); return; }
    } else S.prof[key] = val;
    render(); profAdvance(); return;
  }
  if (d.prof){
    const stash = () => document.querySelectorAll("[data-prof-in]").forEach(f=>{
      if (f.value.trim()) S.prof[f.dataset.profIn] = f.value; });
    if (d.prof==="next" || d.prof==="skip"){
      stash();
      if (S.profStep >= PSCREENS.length-1){
        S.mentor = S.prof.mentor==="Yes";
        if (S.mentor) S.invitesLeft = 2;
        S.view=null; S.tab="me"; render();
        toast(S.mentor ? "Profile saved. As a mentor you now have 2 invites."
                       : `Profile saved — ${profDone().pct}% complete.`);
        return;
      }
      S.profStep++; render(); return;
    }
    if (d.prof==="back"){ stash(); S.profStep=Math.max(0,S.profStep-1); render(); return; }
    if (d.prof==="exit"){ stash(); S.view=null; render(); toast("Saved. Pick it up any time from Me."); return; }
  }

  if (d.kind){ S.composeKind=d.kind; render(); return; }
  if (d.pic!==undefined && t.hasAttribute("data-pic")){
    S.pics = (+d.pic)+1 === S.pics ? +d.pic : (+d.pic)+1; render(); return; }
  if (d.dismiss!==undefined && t.hasAttribute("data-dismiss")){
    S.dismissed.push(+d.dismiss); render();
    toast("Hidden. We'll show you fewer like it."); return; }

  /* ---- onboarding */
  if (d.newpick){
    const [k,v] = d.newpick.split("|");
    S.new[k] = k==="photo" ? !S.new.photo : v; render(); return;
  }
  if (d.setup){
    const stash=()=>document.querySelectorAll("[data-new]").forEach(f=>{S.new[f.dataset.new]=f.value;});
    if (d.setup==="next"){ stash();
      if (STEP[S.step]==="photo"){ S.setup=false; render();
        toast("You're in. 23 members near you, all invited the same way."); return; }
      S.step++; render(); return; }
    if (d.setup==="back"){ stash(); S.step=Math.max(0,S.step-1); render(); return; }
    if (d.setup==="skip"){ S.setup=false; render();
      toast("You're in. Add a photo any time from Me."); return; }
  }

  /* ---- chat */
  if (d.dm !== undefined && t.hasAttribute("data-dm")){ openDM(d.dm); return; }
  if (d.dmid){ S.view={k:"dm",id:d.dmid}; S.tab="chat"; S.draft=""; render(); return; }
  if (d.room){ S.view={k:"room",id:d.room}; S.tab="chat"; S.draft=""; render(); return; }
  if (d.topicid){ const [rid,tid]=d.topicid.split("|");
    const t = topicOf(room(rid),tid); if (t) t.views++;
    S.view={k:"topic",rid,tid}; S.tab="chat"; S.draft=""; render(); return; }
  if (d.sort){ S.roomSort=d.sort; render(); return; }
  if (d.newtopic){ toast("In the real app this opens the new-topic composer."); return; }
  if (d.group){ S.view={k:"grp",id:d.group}; S.tab="chat"; S.draft=""; render(); return; }
  if (d.topic){ openTopic(d.topic); return; }
  if (d.join){ if (!S.joined.includes(d.join)) S.joined.push(d.join);
    render(); toast(`Joined ${room(d.join).n}. Every topic above it was here before you.`); return; }
  if (d.send){
    const f = $("#msg"); const txt = (f?f.value:S.draft).trim();
    if (!txt) return;
    const parts = d.send.split("|");
    if (parts[0]==="topic"){
      const t = topicOf(room(parts[1]), parts[2]);
      t.posts.push({by:null, when:"Just now", t:txt});
      t.replies = t.posts.length-1; t.last = "just now"; t.ago = 0;
    } else {
      const o = parts[0]==="grp"?group(parts[1]):dm(parts[1]);
      o.msgs.push({by:null, when:"Now", t:txt});
    }
    S.draft=""; S.focusMsg=true; render(); S.focusMsg=false; return;
  }

  /* ---- nav + views */
  if (d.tab){ S.tab=d.tab; S.view=null; S.sheet=null; render(); return; }
  if (d.q!==undefined && t.hasAttribute("data-q")){ S.view={k:"q",id:+d.q}; render(); return; }
  if (d.m!==undefined && t.hasAttribute("data-m")){ S.view={k:"m",id:+d.m}; S.tab="peers"; render(); return; }
  if (d.ev!==undefined && t.hasAttribute("data-ev")){ S.view={k:"ev",id:+d.ev}; render(); return; }
  if (d.org!==undefined&& t.hasAttribute("data-org")){ S.view={k:"org",id:+d.org}; render(); return; }

  if (d.homeseg){ S.homeSeg=d.homeseg; render(); return; }
  if (d.chatseg){ S.chatSeg=d.chatseg; render(); return; }
  if (d.peerseg){ S.peerSeg=d.peerseg; render(); return; }
  if (d.evseg){ S.evSeg=d.evseg; render(); return; }

  if (d.f){ const [k,v]=d.f.split("|"); const a=S.filter[k];
    a.includes(v)?a.splice(a.indexOf(v),1):a.push(v); render(); return; }
  if (d.h){ const [k,v]=d.h.split("|"); const a=S.hfilter[k];
    a.includes(v)?a.splice(a.indexOf(v),1):a.push(v); render(); return; }
  if (d.cat){ S.composeCat=d.cat; render(); return; }
  if (d.search!==undefined && t.hasAttribute("data-search")){
    S.search=d.search; S.tab="peers"; S.peerSeg="all"; S.view=null; S.sheet=null; render();
    toast(`Members matching “${d.search}”.`); return; }

  if (d.askthem!==undefined && t.hasAttribute("data-askthem")){
    S.sheet="compose"; S.composeKind="q"; S.composeCat="Something else"; render();
    toast(`Asking the club — ${d.askthem} gets it first.`); return; }
  if (d.thank){ S.thanks[d.thank]=!S.thanks[d.thank]; render(); return; }
  if (d.go!==undefined && t.hasAttribute("data-go")){
    const id=+d.go, g=S.new.going;
    if (g.includes(id)){ g.splice(g.indexOf(id),1); render(); }
    else { g.push(id); evGroup(EV[id]); render();
      toast("You're on the list, and in the group chat for it."); }
    return; }
  if (d.int!==undefined && t.hasAttribute("data-int")){
    const id=+d.int, g=S.new.interested;
    g.includes(id)?g.splice(g.indexOf(id),1):g.push(id); render(); return; }
  if (d.follow!==undefined && t.hasAttribute("data-follow")){
    render(); toast(`Following ${ORGS[+d.follow].n}. Their events show up first.`); return; }

  switch (d.act){
    case "back":
      if (S.view && S.view.k==="topic"){ S.view={k:"room",id:S.view.rid}; render(); return; }
      S.view=null; render(); return;
    case "profile": S.view={k:"prof"}; render(); return;
    case "filters": case "hfilters": case "compose": case "invite":
    case "conduct": case "search": case "bell":
      S.sheet=d.act; render(); return;
    case "closesheet": S.sheet=null; render(); return;
    case "clearf": S.filter={grp:[],topic:[],city:[]}; S.search=""; render(); return;
    case "clearh": S.hfilter={cat:[],city:[]}; render(); return;
    case "anon": S.composeAnon=!S.composeAnon; render(); return;
    case "post": {
      if (S.composeKind==="q"){
        const id = Math.max(...S.q.map(v=>v.id))+1;
        S.q.unshift({id, by:null, anon:S.composeAnon, when:"Just now", cat:S.composeCat, q:S.compose.trim(), a:[]});
        S.feed.unshift({k:"q", id});
        const r = roomFor(S.composeCat);
        toast(r ? `Posted. Also visible in the ${room(r).n} room.`
                : "Posted. If nobody answers in 24 hours we route it to three matching members.");
      } else {
        const id = Math.max(...POSTS.map(v=>v.id))+1;
        POSTS.unshift({id, by:null, mine:true, photo:S.pics>0, when:"Just now", cat:"",
                       t:S.compose.trim() || "…"});
        S.feed.unshift({k:"post", id});
        toast(S.pics ? `Shared ${S.pics} photo${S.pics>1?"s":""} with the club.` : "Shared with the club.");
      }
      S.compose=""; S.pics=0; S.sheet=null; S.tab="home"; S.homeSeg="all"; S.view=null; render(); return; }
    case "answer": toast("In the real app this opens the answer composer."); return;
    case "howto": toast("Invites come from a peer mentor, or from a member organization like NorCal SCI."); return;
    case "sendinvite":
      if (S.invitesLeft>0) S.invitesLeft--;
      S.sheet=null; render();
      toast("Invite texted. It only opens on that phone, and it expires in 7 days."); return;
    case "noop": return;
  }
});

document.addEventListener("input", e=>{
  const el = e.target;

  /* derived cards update in place — never re-render a focused field */
  if (el.dataset.new==="dob"){ S.new.dob=el.value;
    const d=$("#derive"); if (d) d.innerHTML=deriveDob(); syncNext(); return; }
  if (el.dataset.new==="years"){ S.new.years=el.value;
    const d=$("#derive2"); if (d) d.innerHTML=deriveInjury(); syncNext(); return; }
  if (el.dataset.new){ S.new[el.dataset.new]=el.value; syncNext(); return; }

  if (el.dataset.profIn){ S.prof[el.dataset.profIn]=el.value; return; }

  const k = el.dataset.bind;
  if (k){ S[k]=el.value;
    if (k==="compose"){ const b=$('[data-act="post"]');
      if (b){ b.disabled=!S.compose.trim(); b.style.opacity=S.compose.trim()?"":".42"; } }
    if (k==="draft"){ const b=$('[data-send]');
      if (b){ b.disabled=!S.draft.trim(); } }
  }
});
function syncNext(){
  const b=$('[data-setup="next"]');
  if (b){ b.disabled=!canNext(); b.style.opacity=canNext()?"":".42"; }
}
document.addEventListener("keydown", e=>{
  if (e.key==="Enter" && e.target.id==="msg"){ const b=$("[data-send]"); if (b && !b.disabled) b.click(); }
});

render();

</script></body></html>
